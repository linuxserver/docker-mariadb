---

# jenkins variables
project_name: docker-mariadb
external_type: alpine_repo
custom_release_notes_command: |-
  curl -H "Authorization: token ${GITHUB_TOKEN}" -s "https://api.github.com/repos/mariadb/server/releases/tags/mariadb-${EXT_RELEASE%%-r*}" | jq -r '. |.body' > releasebody.json
release_type: stable
release_tag: latest
ls_branch: master
repo_vars:
  - BUILD_VERSION_ARG = 'MARIADB_VERSION'
  - LS_USER = 'linuxserver'
  - LS_REPO = 'docker-mariadb'
  - CONTAINER_NAME = 'mariadb'
  - DOCKERHUB_IMAGE = 'linuxserver/mariadb'
  - DEV_DOCKERHUB_IMAGE = 'lsiodev/mariadb'
  - PR_DOCKERHUB_IMAGE = 'lspipepr/mariadb'
  - DIST_IMAGE = 'alpine'
  - DIST_REPO = 'http://dl-cdn.alpinelinux.org/alpine/v3.24/main/'
  - DIST_REPO_PACKAGES = 'mariadb'
  - MULTIARCH='true'
  - CI='true'
  - CI_WEB='false'
  - CI_PORT='3306'
  - CI_SSL='false'
  - CI_DELAY='360'
  - CI_DOCKERENV='MYSQL_ROOT_PASSWORD=password'
  - CI_AUTH=''
  - CI_WEBPATH=''
